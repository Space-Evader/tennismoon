name: Isolated daily reader readiness proof
on:
  push:
    branches: [test/daily-reader-proof-20261026]
    paths: [.github/workflows/reader-readiness-proof.yml]
permissions: {}
jobs:
  public-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test isolated notification delivery and permitted public retrieval
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, http.server, json, threading, urllib.request
          from urllib.parse import urlencode, urlsplit
          # Test receiver only: no email, personal information, production intake or credentials.
          received = []
          class Receiver(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  value = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  received.append(value['event'])
                  self.send_response(204); self.end_headers()
              def log_message(self, *args): pass
          server = http.server.HTTPServer(('127.0.0.1', 0), Receiver)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          for event in ('synthetic-review-ready', 'injected-reader-failure'):
              request = urllib.request.Request('http://127.0.0.1:%s/' % server.server_port, data=json.dumps({'event':event,'synthetic':True}).encode(), headers={'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=5) as response: assert response.status == 204
          server.shutdown()
          assert received == ['synthetic-review-ready','injected-reader-failure']
          print(json.dumps({'isolated_notification_delivery':received,'owner_email_delivery_tested':False}))
          def get(params):
              url = 'https://en.wikipedia.org/w/api.php?' + urlencode(params)
              req = urllib.request.Request(url,headers={'User-Agent':'TennisMoonReadiness/1.0 (https://github.com/Space-Evader/tennismoon)','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert urlsplit(r.url).scheme == 'https' and urlsplit(r.url).hostname == 'en.wikipedia.org'
                  body = r.read(512001); assert len(body) <= 512000
                  assert r.status == 200
                  return json.loads(body)
          rights = get({'action':'query','meta':'siteinfo','siprop':'rightsinfo','format':'json'})['query']['rightsinfo']
          data = get({'action':'query','prop':'revisions','titles':'2026_Erste_Bank_Open','rvprop':'ids|timestamp','formatversion':2,'format':'json'})
          page = data['query']['pages'][0]
          assert not page.get('missing'), 'Article unavailable; do not fabricate information'
          revision = page['revisions'][0]
          print(json.dumps({'source_url':'https://en.wikipedia.org/wiki/2026_Erste_Bank_Open','source_revision':revision['revid'],'source_modified_at':revision['timestamp'],'reader_retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rights':rights,'owner_approved':False,'production_writes':0,'scheduled_jobs':0}))
          PY
