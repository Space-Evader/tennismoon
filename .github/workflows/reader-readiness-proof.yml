name: Isolated daily reader and notification proof
on:
  push:
    branches: [test/daily-reader-proof-20261026]
    paths: [.github/workflows/reader-readiness-proof.yml]
permissions: {}
jobs:
  source-proof:
    name: source-proof (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [success, injected-failure]
    steps:
      - name: Run pinned reader with an isolated notification receiver
        env:
          PROOF_MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, http.server, json, os, threading, urllib.request
          url = 'https://raw.githubusercontent.com/Space-Evader/tennismoon/45eb14844cb9de7705ee6f3ac7572af7130f5d15/intelligence/wikimedia_reader.py'
          with urllib.request.urlopen(url, timeout=15) as response:
              source = response.read(20001)
          assert len(source) <= 20000 and hashlib.sha256(source).hexdigest() == '452041fa356eba03a4de0e90d9f4b600dcdd836a9e90d868d211b0685bea3a43'
          module = {'__name__':'reader'}
          exec(compile(source, 'pinned-wikimedia-reader.py', 'exec'), module)
          received = []
          class Receiver(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  value = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  assert set(value).issubset({'event','owner_approved','published','packet_id','source_url','source_revision'})
                  received.append(value)
                  self.send_response(204); self.end_headers()
              def log_message(self, *args): pass
          server = http.server.HTTPServer(('127.0.0.1', 0), Receiver)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          target = 'http://127.0.0.1:%s/' % server.server_port
          mode = os.environ['PROOF_MODE']
          if mode == 'injected-failure':
              def failure(params): raise OSError('Synthetic upstream 503')
              try:
                  module['read_calendar']('2026_Erste_Bank_Open', failure)
                  raise AssertionError('Failure injection did not fail')
              except OSError:
                  module['notify_event'](target, 'reader-failed', allow_local=True)
                  assert len(received) == 1 and received[0]['event'] == 'reader-failed'
                  print(json.dumps({'mode':mode,'notification_delivered':received[0],'receiver':'isolated runner loopback','founder_delivery_tested':False}))
                  server.shutdown()
                  raise SystemExit(1)  # Expected negative test: real failed job, no publication.
          packet = module['read_calendar']('2026_Erste_Bank_Open')
          module['notify_event'](target, 'review-ready', packet, True)
          assert len(received) == 1 and received[0]['event'] == 'review-ready'
          print(json.dumps({'mode':mode,'notification_delivered':received[0],'receiver':'isolated runner loopback','founder_delivery_tested':False}))
          print(json.dumps(packet, indent=2))
          server.shutdown()
          PY
  github-notification-proof:
    if: always()
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Deliver minimal test notices as the GitHub Actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/Space-Evader/tennismoon'
          run = os.environ['PROOF_RUN_ID']
          def call(path, payload=None):
              request = urllib.request.Request(base + path, data=json.dumps(payload).encode() if payload else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},
                  method='POST' if payload else 'GET')
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read(100000))
          for issue, event, message in [
              (2, 'review-ready', 'A real public calendar packet is ready for owner review. Verified reader proof: https://github.com/Space-Evader/tennismoon/actions/runs/40386766994 . No owner approval or publication has been granted to the reader.'),
              (3, 'reader-failed', 'The isolated upstream-failure test exited 1 as intended. No approved records were changed. Test run: https://github.com/Space-Evader/tennismoon/actions/runs/' + run)]:
              marker = '<!-- tennismoon-proof-' + run + '-' + event + ' -->'
              comments = call('/issues/%s/comments?per_page=100' % issue)
              if any(marker in c.get('body','') for c in comments):
                  print(json.dumps({'issue':issue,'event':event,'replayed':True})); continue
              comment = call('/issues/%s/comments' % issue, {'body':marker+'\n@Space-Evader — TEST '+event+' notification.\n\n'+message+'\n\nPublic test metadata only; no private source content, production write, deployment or scheduled job.'})
              assert comment['user']['login'].endswith('[bot]')
              print(json.dumps({'issue':issue,'event':event,'bot':comment['user']['login'],'notification_comment_url':comment['html_url']}))
          PY
