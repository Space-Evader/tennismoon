name: Isolated daily reader readiness proof
on:
  push:
    branches: [test/daily-reader-proof-20261026]
    paths: [.github/workflows/reader-readiness-proof.yml]
permissions: {}
jobs:
  public-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test isolated notification delivery and permitted public retrieval
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, http.server, json, threading, urllib.request
          from urllib.parse import urlencode, urlsplit
          # Test receiver only: no email, personal information, production intake or credentials.
          received = []
          class Receiver(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  value = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  received.append(value['event'])
                  self.send_response(204); self.end_headers()
              def log_message(self, *args): pass
          server = http.server.HTTPServer(('127.0.0.1', 0), Receiver)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          for event in ('synthetic-review-ready', 'injected-reader-failure'):
              request = urllib.request.Request('http://127.0.0.1:%s/' % server.server_port, data=json.dumps({'event':event,'synthetic':True}).encode(), headers={'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=5) as response: assert response.status == 204
          server.shutdown()
          assert received == ['synthetic-review-ready','injected-reader-failure']
          print(json.dumps({'isolated_notification_delivery':received,'owner_email_delivery_tested':False}))
          PY
      - name: Produce real unreviewed calendar packet from pinned public reader
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request
          url = 'https://raw.githubusercontent.com/Space-Evader/tennismoon/78d5db3b4c19b884d3d05a404b719f9da38c4145/intelligence/wikimedia_reader.py'
          with urllib.request.urlopen(url, timeout=15) as response:
              source = response.read(20001)
          assert len(source) <= 20000 and hashlib.sha256(source).hexdigest() == '2c012e486d4fee21d83442827c0521cf626a6af0760a61a3046a4d95f338641e'
          exec(compile(source, 'pinned-wikimedia-reader.py', 'exec'), {'__name__':'__main__'})
          PY
